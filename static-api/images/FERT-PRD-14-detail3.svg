    <text x="20" y="28" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#0f172a">• 100평(330㎡) 권장 처방량: 100평당 3~5kg (점적관수 관주 또는 포기 추비)</text>
    <text x="20" y="56" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#334155">• 적용 생육단계: 생육 중기~결구기 점적관주 추비</text>
    <text x="20" y="84" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#0369a1">• 기상·토양 연동 기준: 점적관수 설치 포전 및 결구기 칼슘·칼륨 동시 요구 시</text>
