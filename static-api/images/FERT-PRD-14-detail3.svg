  <g transform="translate(60, 175)">
          <text x="0" y="26" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#0369a1">▶ 100평(330㎡) 권장 처방량: 100평당 3~5kg (점적관수 관주 또는 포기 추비)</text>
          <text x="0" y="62" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#1e293b">▶ 적용 생육단계: 생육 중기~결구기 점적관주 추비</text>
        </g>

