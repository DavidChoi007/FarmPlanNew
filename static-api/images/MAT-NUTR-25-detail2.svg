<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <rect width="600" height="450" rx="20" fill="#0f172a"/>
  <rect x="16" y="16" width="568" height="418" rx="16" fill="#ffffff"/>
  <rect x="16" y="16" width="568" height="76" rx="16" fill="#047857"/>
  <text x="40" y="48" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#a7f3d0">(주)한국삼공 · MAT-NUTR-25</text>
  <text x="40" y="74" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="17" font-weight="900" fill="#ffffff">세부 이미지 ② — 비료 입자(Granule) 성상 및 용출 구조</text>

  <text x="40" y="125" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#0f172a">삼공 아미노플렉스 올인원 (14종 종합영양 + 해조 + 비타민) 500ml</text>

  <!-- 중앙 시각 그래픽 영역 -->
  <rect x="40" y="145" width="520" height="140" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <g transform="translate(70, 165)">
          <circle cx="60" cy="50" r="38" fill="#047857" opacity="0.85"/>
          <circle cx="145" cy="50" r="38" fill="#10b981" opacity="0.9"/>
          <circle cx="230" cy="50" r="38" fill="#f59e0b" opacity="0.9"/>
          <text x="60" y="55" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">균일입상</text>
          <text x="145" y="55" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">속효+지효</text>
          <text x="230" y="55" font-family="sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">미량요소코팅</text>
          <text x="295" y="38" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="15" font-weight="800" fill="#0f172a">제형: 고농축 복합 수용성 액제</text>
          <text x="295" y="66" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#047857">비산 먼지 없는 구형 입자 가공</text>
        </g>

  <!-- 하단 3줄 핵심 스펙 -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="520" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="28" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#0f172a">• 입자 균일도 98% 이상 (고농축 복합 수용성 액제) — 동력살포기 막힘 없음</text>
    <text x="20" y="56" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#334155">• 토양 수분 접촉 시 뿌리권 유효성분 단계적 용출 및 흡수율 극대화</text>
    <text x="20" y="84" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#047857">• 고토(MgO) 2% · 붕소(B) 0.3% · 칼슘(CaO) 1% 함유</text>
  </g>
</svg>