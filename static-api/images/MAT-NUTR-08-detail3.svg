<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <rect width="600" height="450" rx="20" fill="#0f172a"/>
  <rect x="16" y="16" width="568" height="418" rx="16" fill="#ffffff"/>
  <rect x="16" y="16" width="568" height="76" rx="16" fill="#78350f"/>
  <text x="40" y="48" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#a7f3d0">대유 · MAT-NUTR-08</text>
  <text x="40" y="74" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="17" font-weight="900" fill="#ffffff">세부 이미지 ③ — 100평(10a) 표준 시비량 및 살포 방법</text>

  <text x="40" y="125" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#0f172a">대유 루트파워 골드 (정식 직후 세근 발근·활착 몸살 극복 전문제) 500ml</text>

  <!-- 중앙 시각 그래픽 영역 -->
  <rect x="40" y="145" width="520" height="140" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <g transform="translate(60, 175)">
          <text x="0" y="26" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#78350f">▶ 100평(330㎡) 권장 처방량: 100평당 관주 300ml / 엽면 150ml (500배 희석 육묘판 침지·관주)</text>
          <text x="0" y="62" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#1e293b">▶ 적용 생육단계: 정식 직전 트레이 침지 및 정식 후 7일 이내 관주</text>
        </g>

  <!-- 하단 3줄 핵심 스펙 -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="520" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="28" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#0f172a">• 100평(330㎡) 권장 처방량: 100평당 관주 300ml / 엽면 150ml (500배 희석 육묘판 침지·관주)</text>
    <text x="20" y="56" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#334155">• 적용 생육단계: 정식 직전 트레이 침지 및 정식 후 7일 이내 관주</text>
    <text x="20" y="84" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#78350f">• 기상·토양 연동 기준: 정식기 고온·건조 또는 과습으로 뿌리 활착 지연 우려 시</text>
  </g>
</svg>