<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <rect width="600" height="450" rx="20" fill="#0f172a"/>
  <rect x="16" y="16" width="568" height="418" rx="16" fill="#ffffff"/>
  <rect x="16" y="16" width="568" height="76" rx="16" fill="#78350f"/>
  <text x="40" y="48" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#a7f3d0">(주)효성오앤비 · FERT-PRD-11</text>
  <text x="40" y="74" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="17" font-weight="900" fill="#ffffff">세부 이미지 ① — 비료 보증성분표 및 공정규격 라벨</text>

  <text x="40" y="125" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#0f172a">토토유박 골드 1등급 혼합유박 (N 4.3-P 2.0-K 1.2+OM 72%) 20kg</text>

  <!-- 중앙 시각 그래픽 영역 -->
  <rect x="40" y="145" width="520" height="140" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <g transform="translate(60, 165)">
          <rect x="0" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="45" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">질소(N)</text>
          <text x="45" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle">4.3%</text>

          <rect x="100" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="145" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">인산(P₂O₅)</text>
          <text x="145" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#fb923c" text-anchor="middle">2%</text>

          <rect x="200" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="245" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">칼륨(K₂O)</text>
          <text x="245" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#facc15" text-anchor="middle">1.2%</text>

          <rect x="300" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="345" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">칼슘(CaO)</text>
          <text x="345" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#4ade80" text-anchor="middle">1.8%</text>

          <rect x="400" y="0" width="85" height="100" rx="10" fill="#0f172a"/>
          <text x="442" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">고토/유기물</text>
          <text x="442" y="72" font-family="sans-serif" font-size="22" font-weight="900" fill="#c084fc" text-anchor="middle">72%</text>
        </g>

  <!-- 하단 3줄 핵심 스펙 -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="520" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="28" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#0f172a">• 첨가비율: 유기물(OM) 72% · N 4.3% · P₂O₅ 2.0% · K₂O 1.2% + 칼슘(CaO) 1.8%</text>
    <text x="20" y="56" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#334155">• 제형/성상: 숙성 펠릿형 (Pellet) | 포장단위: 20kg / 포</text>
    <text x="20" y="84" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#78350f">• 제조사: (주)효성오앤비 | 구분: 유기질·퇴비</text>
  </g>
</svg>