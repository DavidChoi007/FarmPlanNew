<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <rect width="600" height="450" rx="20" fill="#0f172a"/>
  <rect x="16" y="16" width="568" height="418" rx="16" fill="#ffffff"/>
  <rect x="16" y="16" width="568" height="76" rx="16" fill="#0f766e"/>
  <text x="40" y="48" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#a7f3d0">(주)누보 · FERT-PRD-22</text>
  <text x="40" y="74" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="17" font-weight="900" fill="#ffffff">세부 이미지 ① — 비료 보증성분표 및 공정규격 라벨</text>

  <text x="40" y="125" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#0f172a">엔플러스 패화석·석회보르도 유기농 칼슘개량제 20kg</text>

  <!-- 중앙 시각 그래픽 영역 -->
  <rect x="40" y="145" width="520" height="140" rx="14" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <g transform="translate(60, 165)">
          <rect x="0" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="45" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">질소(N)</text>
          <text x="45" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle">0%</text>

          <rect x="100" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="145" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">인산(P₂O₅)</text>
          <text x="145" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#fb923c" text-anchor="middle">0.5%</text>

          <rect x="200" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="245" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">칼륨(K₂O)</text>
          <text x="245" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#facc15" text-anchor="middle">0.5%</text>

          <rect x="300" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="345" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">칼슘(CaO)</text>
          <text x="345" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#4ade80" text-anchor="middle">42%</text>

          <rect x="400" y="0" width="85" height="100" rx="10" fill="#0f172a"/>
          <text x="442" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">고토/유기물</text>
          <text x="442" y="72" font-family="sans-serif" font-size="22" font-weight="900" fill="#c084fc" text-anchor="middle">5%</text>
        </g>

  <!-- 하단 3줄 핵심 스펙 -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="520" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="28" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#0f172a">• 첨가비율: 칼슘(CaO) 42% + 고토(MgO) 3.0% + 천연 해양미네랄 + 유기물 5%</text>
    <text x="20" y="56" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#334155">• 제형/성상: 천연 굴패각 미세입상 | 포장단위: 20kg / 포</text>
    <text x="20" y="84" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#0f766e">• 제조사: (주)누보 | 구분: 토양개량·칼슘비료</text>
  </g>
</svg>