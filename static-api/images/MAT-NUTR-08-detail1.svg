<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <rect width="600" height="450" rx="20" fill="#0f172a"/>
  <rect x="16" y="16" width="568" height="418" rx="16" fill="#ffffff"/>
  <rect x="16" y="16" width="568" height="76" rx="16" fill="#78350f"/>
  <text x="40" y="48" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#a7f3d0">대유 · MAT-NUTR-08</text>
  <text x="40" y="74" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="17" font-weight="900" fill="#ffffff">세부 이미지 ① — 비료 보증성분표 및 공정규격 라벨</text>

  <text x="40" y="125" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#0f172a">대유 루트파워 골드 (정식 직후 세근 발근·활착 몸살 극복 전문제) 500ml</text>

  <!-- 중앙 시각 그래픽 영역 -->
  <rect x="40" y="145" width="520" height="140" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <g transform="translate(60, 165)">
          <rect x="0" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="45" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">질소(N)</text>
          <text x="45" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle">5%</text>

          <rect x="100" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="145" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">인산(P₂O₅)</text>
          <text x="145" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#fb923c" text-anchor="middle">3%</text>

          <rect x="200" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="245" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">칼륨(K₂O)</text>
          <text x="245" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#facc15" text-anchor="middle">3%</text>

          <rect x="300" y="0" width="90" height="100" rx="10" fill="#0f172a"/>
          <text x="345" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">칼슘(CaO)</text>
          <text x="345" y="72" font-family="sans-serif" font-size="24" font-weight="900" fill="#4ade80" text-anchor="middle">0.5%</text>

          <rect x="400" y="0" width="85" height="100" rx="10" fill="#0f172a"/>
          <text x="442" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">고토/유기물</text>
          <text x="442" y="72" font-family="sans-serif" font-size="22" font-weight="900" fill="#c084fc" text-anchor="middle">34%</text>
        </g>

  <!-- 하단 3줄 핵심 스펙 -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="520" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="28" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#0f172a">• 첨가비율: 유리 아미노산 22% + 풀빅산(Fulvic Acid) 12% + P₂O₅ 3% + K₂O 3% + 아연(Zn) 0.1%</text>
    <text x="20" y="56" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#334155">• 제형/성상: 발근성 아미노산·풀빅산 액제 | 포장단위: 500ml / 병</text>
    <text x="20" y="84" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#78350f">• 제조사: 대유 | 구분: 뿌리발근·초기활착 영양재</text>
  </g>
</svg>