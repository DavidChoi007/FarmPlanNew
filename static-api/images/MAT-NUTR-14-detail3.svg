    <text x="20" y="56" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#334155">• 적용 생육단계: 결구 중후기 ~ 수확 14일 전 (7일 간격 2회)</text>
    <text x="20" y="84" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#047857">• 기상·토양 연동 기준: 수확 전 구중 확보 및 초겨울 한파 대비 세포액 농도(내한성) 강화 시</text>
