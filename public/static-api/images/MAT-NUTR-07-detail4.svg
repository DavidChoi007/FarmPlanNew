<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <rect width="600" height="450" rx="20" fill="#0f172a"/>
  <rect x="16" y="16" width="568" height="418" rx="16" fill="#ffffff"/>
  <rect x="16" y="16" width="568" height="76" rx="16" fill="#0f766e"/>
  <text x="40" y="48" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#a7f3d0">대유 · MAT-NUTR-07</text>
  <text x="40" y="74" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="17" font-weight="900" fill="#ffffff">세부 이미지 ④ — 작물(가을배추·감자·엽채류) 시비 효과 비교</text>

  <text x="40" y="125" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#0f172a">대유 속찬칼슘붕소 (배추 꿀통·팁번 예방 고흡수 킬레이트 칼슘제) 500ml</text>

  <!-- 중앙 시각 그래픽 영역 -->
  <rect x="40" y="145" width="520" height="140" rx="14" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <g transform="translate(60, 175)">
          <text x="0" y="26" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#0f766e">▶ 대상 효능: 배추 내엽갈변(꿀통배추)·무 속빈현상·상추 팁번(잎끝마름) 예방 및 결구 단단함 향상</text>
          <text x="0" y="62" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#1e293b">▶ 무처리구 대비 뿌리 세근 발달 +34%, 결구·괴경 충실도 +28% 향상</text>
        </g>

  <!-- 하단 3줄 핵심 스펙 -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="520" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="28" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#0f172a">• 대상 효능: 배추 내엽갈변(꿀통배추)·무 속빈현상·상추 팁번(잎끝마름) 예방 및 결구 단단함 향상</text>
    <text x="20" y="56" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#334155">• 무처리구 대비 뿌리 세근 발달 +34%, 결구·괴경 충실도 +28% 향상</text>
    <text x="20" y="84" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#0f766e">• 생리장해(칼슘결핍·붕소결핍·황화현상) 선제 예방 검증</text>
  </g>
