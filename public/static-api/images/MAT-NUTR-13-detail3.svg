<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <rect width="600" height="450" rx="20" fill="#0f172a"/>
  <rect x="16" y="16" width="568" height="418" rx="16" fill="#ffffff"/>
  <rect x="16" y="16" width="568" height="76" rx="16" fill="#047857"/>
  <text x="40" y="48" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#a7f3d0">(주)경농 · MAT-NUTR-13</text>
  <text x="40" y="74" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="17" font-weight="900" fill="#ffffff">세부 이미지 ③ — 100평(10a) 표준 시비량 및 살포 방법</text>

  <text x="40" y="125" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#0f172a">뿌리왕 하이루트 (휴믹산·해조류·인산 기반 세근발달 촉진제) 1L</text>

  <!-- 중앙 시각 그래픽 영역 -->
  <rect x="40" y="145" width="520" height="140" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <g transform="translate(60, 175)">
          <text x="0" y="26" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="900" fill="#047857">▶ 100평(330㎡) 권장 처방량: 100평당 관주 400ml / 엽면 150ml (500~800배 희석)</text>
          <text x="0" y="62" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#1e293b">▶ 적용 생육단계: 정식 직후 활착기 및 폭우 후 뿌리 세력 회복기</text>
        </g>

  <!-- 하단 3줄 핵심 스펙 -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="520" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="28" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="800" fill="#0f172a">• 100평(330㎡) 권장 처방량: 100평당 관주 400ml / 엽면 150ml (500~800배 희석)</text>
    <text x="20" y="56" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#334155">• 적용 생육단계: 정식 직후 활착기 및 폭우 후 뿌리 세력 회복기</text>
    <text x="20" y="84" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#047857">• 기상·토양 연동 기준: 집중호우·과습으로 뿌리 호흡 저하 및 지상부 시듦(위조) 발생 시</text>
  </g>
</svg>